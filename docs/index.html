<div id="sp500-live-status" role="status" aria-live="polite">Piyasa verisi kontrol ediliyor… <button type="button" id="sp500-live-refresh">Yenile</button></div>
<script>
(function(){
  const el=document.getElementById('sp500-live-status');
  const button=document.getElementById('sp500-live-refresh');
  const endpoint='/SP500-Analysis/latest_results.json';
  let seen=null;
  function text(s){const span=document.createElement('span');span.textContent=s;el.replaceChildren(span,button);}
  async function check(manual=false){
    try{
      const response=await fetch(endpoint+'?t='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw Error('HTTP '+response.status);
      const rows=await response.json();
      if(!Array.isArray(rows)||!rows.length)throw Error('Veri listesi boş');
      const stamps=rows.map(x=>x.last_market_update_utc).filter(Boolean).sort();
      const stamp=stamps.at(-1);
      const sessions=rows.map(x=>x.last_price_date).filter(Boolean).sort();
      const session=sessions.at(-1);
      if(!stamp)throw Error('Güncelleme zamanı yok');
      const date=new Date(stamp);
      if(Number.isNaN(date.getTime()))throw Error('Geçersiz güncelleme zamanı');
      const age=(Date.now()-date.getTime())/3600000;
      const label='Son veri: '+date.toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})+' · '+rows.length+' hisse'+(session?' · Seans: '+session:'')+(age>96?' · Veri eski olabilir':'');
      text(label);
      if(seen&&seen!==stamp&&!manual){location.reload();return;}
      seen=stamp;
      if(manual)location.reload();
    }catch(err){text('Veri kontrol edilemedi: '+err.message);}
  }
  button.addEventListener('click',()=>check(true));
  check();
  setInterval(()=>check(false),300000);
})();
