services:
  - type: web
    name: sp500-analysis-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REFRESH_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

