name: Quality checks
on:
  push:
    branches: [main, fix/data-refresh-integrity-20261117]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q backend tests
      - name: Run diagnostics tests
        run: python -m unittest discover -s tests -v
