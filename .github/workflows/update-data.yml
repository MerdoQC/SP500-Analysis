name: Günlük S&P 500 Fiyat Güncellemesi

on:
  workflow_dispatch:

  schedule:
    # ABD'de Pazartesi-Cuma kapanışından sonra çalışır.
    # 22:30 UTC = Türkiye saatiyle ertesi gün 01:30
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

# Aynı anda iki güncellemenin çalışmasını engeller.
concurrency:
  group: sp500-daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: Güncel borsa fiyatlarını çek
        run: python -m backend.update_data

      - name: Güncel veriyi siteye aktar
        run: cp data/latest_results.json docs/latest_results.json

      - name: Güncellenen verileri GitHub'a kaydet
        run: |
          git config user.name "sp500-analysis-bot"
          git config user.email "sp500-analysis-bot@users.noreply.github.com"

          git add \
            data/latest_results.json \
            data/history \
            data/forecasts \
            docs/latest_results.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek veri değişikliği bulunamadı."
            exit 0
          fi

          git commit -m "Günlük piyasa fiyatları güncellendi"
          git pull --rebase origin main
          git push origin HEAD:main
